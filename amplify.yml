version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # Stage 7: changed from `out` (static export) to `.next` (SSR).
        # The Amplify app must be switched to "Next.js - SSR" platform in the
        # Amplify Console before the next production build.  See deployment.md.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: web
