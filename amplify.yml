version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        # WEB_COMPUTE (Next.js SSR): Amplify injects NEXT_ADAPTER_PATH at build
        # time, which causes `next build` to emit .amplify-hosting/ containing
        # deploy-manifest.json.  Point baseDirectory here, not at .next/.
        baseDirectory: .amplify-hosting
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: web
