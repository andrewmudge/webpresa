version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      # No artifacts section: Amplify performs its own framework detection on
      # the build output, sets NEXT_ADAPTER_PATH automatically for WEB_COMPUTE
      # apps, and generates deploy-manifest.json from the .next/ directory.
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: web
